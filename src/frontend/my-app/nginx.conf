server {
    listen 3000;
    server_name localhost;

    # Static frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy NIDS ML API
    location /predict {
        proxy_pass http://nids-ml-api:5000/predict;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /defense/ {
        proxy_pass http://nids-ml-api:5000/defense/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /incidents/ {
        proxy_pass http://nids-ml-api:5000/incidents/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy Socket.IO WebSocket connections
    location /socket.io/ {
        proxy_pass http://nids-ml-api:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Insider Threat API
    location /api/ {
        proxy_pass http://insider-threat:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
